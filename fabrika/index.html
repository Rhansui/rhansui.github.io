<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Da Vinci'nin Fabrikası — Mekanik Evrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Great+Vibes&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root { --gold:#e9c46a; --ink:#2b1708; --parch:#f5e6c8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#160c05; font-family:'Lora', Georgia, serif; color:var(--ink); user-select:none; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; aspect-ratio:16/9; width:min(100vw, 177.78vh); height:min(100vh, 56.25vw); }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }

  .hud { position:absolute; pointer-events:none; text-align:center; }
  #banner { top:1.6%; left:50%; transform:translateX(-50%); width:58%; padding:.38em 1em;
    background:linear-gradient(180deg, rgba(248,233,198,.92), rgba(226,198,148,.92));
    border:3px solid #6b4622; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #banner h1 { font-family:'Cinzel',serif; font-weight:900; font-size:clamp(12px, 1.5vw, 24px); letter-spacing:.04em; color:#331a06; }
  #banner p  { font-size:clamp(9px, 1vw, 15px); color:#5a3312; margin-top:.12em; font-weight:700; }

  .btn { font-family:'Cinzel',serif; font-weight:800; cursor:pointer; border:none; border-radius:11px;
    font-size:clamp(10px, 1.3vw, 20px); padding:.5em 1.05em; color:#2b1606;
    background:radial-gradient(circle at 30% 25%, #fff3b0, #e9b949 45%, #a8711c 100%);
    box-shadow:0 0 0 3px #5a3a1c, 0 5px 12px rgba(0,0,0,.5); transition:transform .12s, filter .12s; }
  .btn:hover { transform:translateY(-2px) scale(1.03); filter:brightness(1.08); }
  .btn:active { transform:scale(.97); }

  #modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,10,3,.62); backdrop-filter:blur(3px); z-index:20; }
  #modal.on { display:flex; }
  .card { width:min(66%, 780px); padding:2em 2.2em 1.6em; text-align:center; position:relative;
    background:linear-gradient(rgba(248,234,202,.94), rgba(235,212,165,.96));
    border:5px solid #5a3a1c; border-radius:16px; box-shadow:0 0 0 3px #c79a4a inset, 0 20px 60px rgba(0,0,0,.75), 0 0 50px rgba(255,190,80,.35);
    font-size:clamp(12px, 1.4vw, 21px); color:#261305; animation:pop .4s cubic-bezier(.2,1.5,.4,1); }
  .card h2 { font-family:'Cinzel',serif; font-weight:900; font-size:1.55em; margin-bottom:.45em; color:#3a1f08; }
  .card p { line-height:1.55; margin-bottom:1em; font-weight:600; }
  .card .btn { position:static; margin:.3em; }
  @keyframes pop { from { transform:scale(.7); opacity:0 } to { transform:scale(1); opacity:1 } }

  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-weight:800; color:var(--gold); font-size:24px; background:#1a0f08; z-index:30; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1600" height="900"></canvas>
    <div id="banner" class="hud">
      <h1 id="title">Bölüm 1</h1>
    </div>
    <div id="modal"><div class="card" id="card"></div></div>
    <div id="loading">✒️ Mühendislik masası hazırlanıyor...</div>
  </div>
</div>
<script src="levels.js?v=33"></script>
<script src="game.js?v=33"></script>
</body>
</html>
